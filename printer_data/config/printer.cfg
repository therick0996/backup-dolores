# This file should just be includes for actual config files!

[include fluidd.cfg]
[include macros/*.cfg]
[include config/*.cfg]
[include KAMP_Settings.cfg]
[exclude_object]
[skew_correction]

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[save_variables]
filename: ~/printer_data/config/variables.cfg

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 15000
max_z_velocity: 30
max_z_accel: 350
square_corner_velocity: 15

[gcode_arcs]
resolution: 0.1      # Enable arcs support

[idle_timeout]
# only turn off motors and heaters if the printer is not paused
gcode:
    {% if not (printer.pause_resume.is_paused) %}
        RESPOND MSG="Idle timeout reached"
        TURN_OFF_HEATERS
        M84
    {% endif %}
timeout: 2700

## SKR 3EZ
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_340052001051303232383230-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

#####################################################################
##   Beacon
#####################################################################

[beacon]
## https://docs.beacon3d.com/contact/
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_10E1189D5154354D38202020FF0A2120-if00
is_non_critical: False
x_offset: 0
y_offset: 24.5
mesh_main_direction: x
mesh_overscan: 1
mesh_runs: 4
contact_max_hotend_temperature: 185

home_xy_position: 117.5, 117.5
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 150

home_method: proximity # <contact|proximity> use proximity for induction homing
home_method_when_homed: proximity # <contact|proximity> after initial calibration use induction
home_autocalibrate: unhomed # <always|unhomed|never> contact will calibrate beacon on first home

# [gcode_macro _HOME_PRE_AXIS]
# gcode:
#   {% set axis = params.AXIS %}
#   SET_KINEMATIC_POSITION {axis}=117.5
#   G91
#   G0 {axis}-10 M204 S250 F3000

#####################################################################
# Extruder
#####################################################################

[extruder]                      # extruder section needs to stay here otherwise PID tuning gets mad
step_pin: H36_combo:PB9 
dir_pin: H36_combo:PB8
enable_pin: !H36_combo:PB7

rotation_distance: 22.65127
gear_ratio: 50:10               #for Stealthburner/Clockwork2 BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: H36_combo: PA7 
pullup_resistor: 2200
sensor_type: NTC 100K MGB18-104F39050L32 # PT1000
sensor_pin: H36_combo:PA6 
min_temp: 1
max_temp: 360 #360 
max_power: 0.8
min_extrude_temp: 170
max_extrude_only_distance: 120
#control = pid
#pid_kp = 18.519
#pid_ki = 0.841
#pid_kd = 101.972
pressure_advance: 0.038
max_extrude_cross_section: 5000

[tmc2209 extruder]
uart_pin: H36_combo:PC14
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
# diag_pin: H36_combo:PC15

#####################################################################
##   X/Y Stepper Settings
#####################################################################

## B Stepper - Left
## Connected to MOTOR_X
[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200 #set to 200 for 1.8 degree, 400 for 0.9 degree
endstop_pin: H36_combo:PB1 #tmc2209_stepper_x:virtual_endstop
position_min: -2
position_max: 237
position_endstop: 237
homing_speed: 80 #40 #80
homing_retract_dist: 5
homing_retract_speed: 20
min_home_dist: 5
second_homing_speed: 20
# use_sensorless_homing: False
# homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PD5
interpolate: true
run_current: 1.0 #0.9
# home_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0 #0 is off
# diag_pin: ^PC1 # use the same pin that was previously the endstop_pin!
# driver_SGTHRS: 15 # 255 is most sensitive value, 0 is least sensitive
# current_change_dwell_time: 2

##  A Stepper - Right
##  Connected to MOTOR_Y
[stepper_y]
step_pin: PA15
dir_pin: !PA8
enable_pin: !PD1
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200 #set to 200 for 1.8 degree, 400 for 0.9 degree
endstop_pin: PC3 #tmc2209_stepper_y:virtual_endstop #PG9
position_min: -6
position_max: 246
position_endstop: 246
homing_speed: 80 #40 #80
homing_retract_dist: 5
homing_retract_speed: 20
min_home_dist: 5
second_homing_speed: 20
# use_sensorless_homing: False
# homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD0
interpolate: true
run_current: 1.0 #0.9
# home_current: 1.0
sense_resistor: 0.110
stealthchop_threshold: 0 #0 is off
# diag_pin: ^PC3 # use the same pin that was previously the endstop_pin!
# driver_SGTHRS: 15 # 255 is most sensitive value, 0 is least sensitive
# current_change_dwell_time: 2

#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_E1
[stepper_z]
step_pin: PD11
dir_pin: PD10
enable_pin: !PD13
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

position_max: 240
position_min: -10
homing_speed: 10
second_homing_speed: 3

endstop_pin: probe:z_virtual_endstop # use beacon as virtual endstop
homing_retract_dist: 0 # beacon needs this to be set to 0

[tmc2209 stepper_z]
uart_pin: PD12
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear
##  Connected to MOTOR_E0
[stepper_z1]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_Z
[stepper_z2]
step_pin: PE2
dir_pin: PE3
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PE1
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[z_tilt]
z_positions:
   -55, 10
   117.5, 285
   290, 10
points:
   10, -5
   117.5, 190
   220, -5

speed: 350
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.0075

#####################################################################
##   Bed Heater
#####################################################################

##  SSR Pin - BED
##  Thermistor - TB
[heater_bed]
heater_pin: PD7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA1
max_power: 1.0 #0.85
min_temp: 0
max_temp: 120

#control = pid
#pid_kp = 53.035
#pid_ki = 2.652
#pid_kd = 265.175

[bed_mesh]
speed: 150                              #   Movement speed during mesh measurement.
zero_reference_position: 117.5, 117.5   #   Setting this parameter will normalize mesh adjustments to the offset found
                                          #   at the specified position. This should nearly always be the same as your
                                          #   safe_z_home position and the position where beacon_calibrate was performed.
horizontal_move_z: 5                    # the Z coordinate the probe rises to prior to traveling between points, default is 5
mesh_min: 30, 25                        # The first probed coordinate, nearest to the origin relative to probe
mesh_max: 210, 210                      # The probed coordinate farthest farthest from the origin
probe_count: 10, 10                     # The number of points to probe on each axis, specified as X, Y integer values.
fade_start: 1                           # Z height in which to start phasing out adjustment
fade_end: 10                            # Z height in which fade should complete.
fade_target: 0                          # thought of as an additional Z offset applied to the entire bed after fade completes
mesh_pps: 2, 2                          # specifies how many points to interpolate for each segment along the X and Y axes
algorithm: bicubic                      # may be either "lagrange" or "bicubic". Default is lagrange
bicubic_tension: 0.2                    # larger numbers will increase the amount of slope, which results in more curvature in the mesh. Default is .2

#####################################################################
##   Retraction
#####################################################################

[firmware_retraction]
retract_length: 0.4         # The length of filament (in mm) to retract when G10 is activated, and to unretract
                            # when G11 is activated (but see unretract_extra_length below). The default is 0 mm.
retract_speed: 20           # The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0   # The length (in mm) of *additional* filament to add when unretracting.
unretract_speed: 10         # The speed of unretraction, in mm/s. The default is 10 mm/s.

#####################################################################
##   Temps
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor SKR_3]
sensor_type: temperature_mcu  #temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor chamber_temp]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA2
min_temp: 0
max_temp: 100
gcode_id: chamber_th

[temperature_sensor chamber_temp_2]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA3
min_temp: 0
max_temp: 100
gcode_id: chamber_th_2

# [temperature_sensor nitehawk]
# sensor_type: temperature_mcu
# sensor_mcu: nhk
# min_temp: 0
# max_temp: 100

#####################################################################
#   Respond
#####################################################################
[respond]
default_type: command
default_prefix: echo:


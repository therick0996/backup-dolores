#####################################################################
##   Print End
#####################################################################

[gcode_macro PRINT_END]
gcode:
    {% set chambertemp = params.CHAMBER|default(0)|int %}               # get chamber temp from slicer
    {% set z_speed = printer["gcode_macro _SETTINGS"].z_speed %}        # get z_speed from macro_settings
    
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + (20 if (th.axis_maximum.x - th.position.x > 20) else -20) %}
    {% set y_safe = th.position.y + (20 if (th.axis_maximum.y - th.position.y > 20) else -20) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    # SET_SKEW CLEAR=1
    
    M400                    # wait for buffer to clear
    G92 E0                  # zero the extruder
    {% if printer.extruder.temperature|float >= printer.configfile.settings.extruder.min_extrude_temp|float %}
        G1 E-2 F1800        # retract filament (only if the nozzle is hot enough)
    {% endif %}

    G90                                 # absolute positioning
    G0 Z{z_safe} F{z_speed}             # lift 2 mm at the Z speed limit
    G0 X{x_safe} Y{y_safe} F12000       # fast XY move to remove stringing
    
    NOZZLE_PARK             # park nozzle at rear
    _PRINT_END_RAISE        # raise 20 mm, capped at max Z
    
    M107                    # turn off part cooling fan
    BED_MESH_CLEAR          # clear bed mesh
    TURN_OFF_HEATERS        # turn off heaters

    SET_FAN_SPEED FAN=nevermore SPEED=0     # turn off nevermore fan
    SET_FAN_SPEED FAN=bed_fans SPEED=0      # turn off bed fans

    # reset printer speeds and limits
    {% set pc = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT VELOCITY={pc.max_velocity} ACCEL={pc.max_accel} SQUARE_CORNER_VELOCITY={pc.square_corner_velocity}

    SET_LED LED="nozzle_led" RED=0 GREEN=0 BLUE=0 WHITE=0  # LED off

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

    M84                     # disable motors 

#####################################################################
##   Clean nozzle
#####################################################################
[gcode_macro CLEAN_NOZZLE]
variable_start_x: 150
variable_start_y: 245
variable_wipe_dist: 30
variable_wipe_qty: 10
variable_wipe_spd: 350
variable_travel_speed: 15000  # 250mm/s

gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    SAVE_GCODE_STATE NAME=STATE_CLEAN_NOZZLE
    G90

    ## Move nozzle to start position (no Z moves, brush is gantry-mounted)
    G1 F{travel_speed}
    G1 X{start_x - 20} Y{start_y}
    G1 X{start_x} Y{start_y}

    ## Wipe nozzle
    {% for wipes in range(wipe_qty) %}
        G1 X{start_x + wipe_dist} F{wipe_spd * 60}
        G1 X{start_x} F{wipe_spd * 60}
    {% endfor %}

    RESTORE_GCODE_STATE NAME=STATE_CLEAN_NOZZLE

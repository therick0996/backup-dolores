#####################################################################
##   Pause Print
#####################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE

variable_x_park: 142
variable_y_park: 245
variable_xy_speed: 200      # mm/s
variable_z_raise_speed: 15  # mm/s
variable_xy_accel: 7500
variable_z_hop: 15          # default lift in mm (override with PAUSE Z=..)

gcode:
    {% set z = params.Z|default(z_hop)|float %}

    {% if not printer.pause_resume.is_paused %}

        {% set z_max = printer.toolhead.axis_maximum.z %}
        {% set z_target = [printer.gcode_move.position.z + z, z_max]|min %}

        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_x VALUE={printer.gcode_move.position.x}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_y VALUE={printer.gcode_move.position.y}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=resume_z VALUE={printer.gcode_move.position.z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=hop_z VALUE={z_target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_velocity VALUE={printer.toolhead.max_velocity}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=saved_accel VALUE={printer.toolhead.max_accel}

        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE

        SET_VELOCITY_LIMIT VELOCITY={xy_speed} ACCEL={xy_accel}

        {% if z_target < printer.gcode_move.position.z + z %}
            { action_respond_info("Pause lift clamped to max Z height.") }
        {% endif %}

        # Raise nozzle (absolute), then park
        G90
        G1 Z{z_target} F{z_raise_speed * 60}
        G1 X{x_park} Y{y_park} F{xy_speed * 60}

        SAVE_GCODE_STATE NAME=PAUSEPARK
        SET_IDLE_TIMEOUT TIMEOUT=43200

    {% endif %}
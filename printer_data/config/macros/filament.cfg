#####################################################################
##   Filament load / unload
##
##   Replaces the old FILAMENT_LOAD and FILAMENT_UNLOAD macros.
##   Add to printer.cfg with:   [include filament.cfg]
##
##   Buttons to use in Fluidd / KlipperScreen:
##     FILAMENT_LOAD_MENU     popup: PLA / ABS / current temp
##     FILAMENT_UNLOAD_MENU   popup: PLA / ABS / current temp
##
##   Direct commands (console or other macros):
##     FILAMENT_LOAD [TEMP=230]
##     FILAMENT_UNLOAD [TEMP=230]
##     FILAMENT_FLUSH [TEMP=230]    (load + flush, use after an unload)
##
##   Needs [respond] (included by fluidd.cfg / mainsail.cfg).
##   [firmware_retraction] is not required by this file.
#####################################################################


#####################################################################
##   Settings and state (edit values here)
#####################################################################
[gcode_macro _FILAMENT_STATE]
description: Settings and flags shared by the filament macros
variable_pla_temp: 220              # hotend temp for PLA load/unload
variable_abs_temp: 260              # hotend temp for ABS load/unload
variable_default_temp: 240          # used when the hotend is cold and no TEMP is given
variable_load_length: 60            # mm of filament pushed in on load
variable_unload_length: 75          # mm pulled out on unload
variable_flush_length: 125          # mm extruded by FILAMENT_FLUSH
variable_speed: 10                  # mm/s for load and unload moves
variable_flush_speed: 8             # mm/s for the flush
variable_wait_window: 10            # degrees above the target allowed when waiting (see _FILAMENT_HEAT)
variable_off_delay: 120             # seconds after a load/unload with no activity before the heater turns off
variable_standby_temp: 180          # temp FILAMENT_LOAD drops to right after extruding
variable_long_purge: 0              # set to 1 by FILAMENT_LOAD, cleared by START_PURGE
variable_long_purge_length: 150     # purge length START_PURGE uses after a filament swap
variable_heater_auto: 0             # internal: 1 while the unload timer is waiting
variable_auto_temp: 0               # internal: temp the macro set, so the timer can tell if you changed it
gcode:


#####################################################################
##   Heat helper: wait until the temp is reached, not until it settles
#####################################################################
[gcode_macro _FILAMENT_HEAT]
description: Set the hotend target and wait until the temp is first inside the window
gcode:
    {% set fs = printer["gcode_macro _FILAMENT_STATE"] %}
    {% set temp = params.TEMP|float %}
    {% set top = temp + fs.wait_window|float %}
    M104 S{temp}
    {% if printer.extruder.temperature|float <= top %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp} MAXIMUM={top}
    {% else %}
        # Already hotter than the window (e.g. mid-pause): don't wait for it to cool
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp}
    {% endif %}


#####################################################################
##   Extruder move helper: splits long moves to stay under
##   max_extrude_only_distance (Klipper rejects longer extrude-only moves)
#####################################################################
[gcode_macro _FILAMENT_MOVE]
description: Extrude-only move of LENGTH mm (negative = retract) at SPEED mm/s
gcode:
    {% set length = params.LENGTH|float %}
    {% set speed = params.SPEED|float %}
    {% set limit = printer.configfile.settings.extruder.max_extrude_only_distance|float - 1 %}
    {% set remaining = length|abs %}
    {% set sign = 1 if length >= 0 else -1 %}
    {% set n = (remaining / limit)|round(0, 'ceil')|int %}
    {% for i in range(n) %}
        G1 E{sign * remaining / n} F{speed * 60}
    {% endfor %}


#####################################################################
##   Unload filament
#####################################################################
[gcode_macro FILAMENT_UNLOAD]
description: Unload filament. Optional TEMP=. Uses the current target if hot, else the default.
gcode:
    {% set fs = printer["gcode_macro _FILAMENT_STATE"] %}
    {% set current = printer.extruder.target|float %}
    {% set was_cold = (current == 0) or (fs.heater_auto|int == 1) %}
    {% set temp = params.TEMP|default(current if current > 0 else fs.default_temp)|float %}

    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("FILAMENT_UNLOAD: not while printing. Pause first.") }
    {% endif %}

    SAVE_GCODE_STATE NAME=FILAMENT_UNLOAD
    _FILAMENT_HEAT TEMP={temp}                        # heat; continue as soon as the temp is reached
    M83                                               # relative extrusion
    _FILAMENT_MOVE LENGTH=-{fs.unload_length} SPEED={fs.speed}   # pull filament out
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0      # free the extruder so it can be pulled by hand
    {% if was_cold %}
        # This macro did the heating: leave the heater on so a new filament can be
        # loaded, and let the timer turn it off if nothing happens.
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=heater_auto VALUE=1
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=auto_temp VALUE={temp}
        UPDATE_DELAYED_GCODE ID=_FILAMENT_HEATER_OFF DURATION={fs.off_delay}
    {% endif %}
    RESTORE_GCODE_STATE NAME=FILAMENT_UNLOAD


#####################################################################
##   Load filament
#####################################################################
[gcode_macro FILAMENT_LOAD]
description: Load filament. Optional TEMP=. Uses the current target if hot, else the default.
gcode:
    {% set fs = printer["gcode_macro _FILAMENT_STATE"] %}
    {% set current = printer.extruder.target|float %}
    {% set was_cold = (current == 0) or (fs.heater_auto|int == 1) %}
    {% set temp = params.TEMP|default(current if current > 0 else fs.default_temp)|float %}

    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("FILAMENT_LOAD: not while printing. Pause first.") }
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_FILAMENT_HEATER_OFF DURATION=0   # cancel any running timer

    SAVE_GCODE_STATE NAME=FILAMENT_LOAD
    _FILAMENT_HEAT TEMP={temp}                        # heat; continue as soon as the temp is reached
    M83                                               # relative extrusion
    _FILAMENT_MOVE LENGTH={fs.load_length} SPEED={fs.speed}      # push filament in
    {% if was_cold %}
        # A filament macro did the heating: drop to standby now (no waiting for it to cool),
        # and turn the heater off if nothing happens within off_delay
        M104 S{fs.standby_temp}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=heater_auto VALUE=1
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=auto_temp VALUE={fs.standby_temp}
        UPDATE_DELAYED_GCODE ID=_FILAMENT_HEATER_OFF DURATION={fs.off_delay}
    {% endif %}
    RESTORE_GCODE_STATE NAME=FILAMENT_LOAD

    # Flag the next START_PURGE to use the long purge (new filament)
    SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=long_purge VALUE=1


#####################################################################
##   Flush filament (load + purge in one move; use after an unload)
#####################################################################
[gcode_macro FILAMENT_FLUSH]
description: Load and flush filament. Optional TEMP=. Leaves the hotend temperature unchanged.
gcode:
    {% set fs = printer["gcode_macro _FILAMENT_STATE"] %}
    {% set current = printer.extruder.target|float %}
    {% set temp = params.TEMP|default(current if current > 0 else fs.default_temp)|float %}

    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("FILAMENT_FLUSH: not while printing. Pause first.") }
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_FILAMENT_HEATER_OFF DURATION=0   # cancel any running timer
    SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=heater_auto VALUE=0

    SAVE_GCODE_STATE NAME=FILAMENT_FLUSH
    _FILAMENT_HEAT TEMP={temp}                                    # heat; continue as soon as the temp is reached
    M83                                                           # relative extrusion
    _FILAMENT_MOVE LENGTH={fs.flush_length} SPEED={fs.flush_speed}   # load and flush
    RESTORE_GCODE_STATE NAME=FILAMENT_FLUSH


#####################################################################
##   Heater-off timer (started by FILAMENT_UNLOAD and FILAMENT_LOAD,
##   cancelled by the next FILAMENT_LOAD)
#####################################################################
[delayed_gcode _FILAMENT_HEATER_OFF]
gcode:
    {% set fs = printer["gcode_macro _FILAMENT_STATE"] %}
    {% if fs.heater_auto|int == 1 %}
        SET_GCODE_VARIABLE MACRO=_FILAMENT_STATE VARIABLE=heater_auto VALUE=0
        # Skip if a print started or you changed the temperature in the meantime
        {% if printer.print_stats.state != "printing" and printer.extruder.target|float == fs.auto_temp|float %}
            M104 S0
            { action_respond_info("Filament timer: heater turned off.") }
        {% endif %}
    {% endif %}


#####################################################################
##   Material wrappers (hidden from the macro list by the underscore)
#####################################################################
[gcode_macro _FILAMENT_LOAD_PLA]
gcode:
    FILAMENT_LOAD TEMP={printer["gcode_macro _FILAMENT_STATE"].pla_temp}

[gcode_macro _FILAMENT_LOAD_ABS]
gcode:
    FILAMENT_LOAD TEMP={printer["gcode_macro _FILAMENT_STATE"].abs_temp}

[gcode_macro _FILAMENT_UNLOAD_PLA]
gcode:
    FILAMENT_UNLOAD TEMP={printer["gcode_macro _FILAMENT_STATE"].pla_temp}

[gcode_macro _FILAMENT_UNLOAD_ABS]
gcode:
    FILAMENT_UNLOAD TEMP={printer["gcode_macro _FILAMENT_STATE"].abs_temp}


#####################################################################
##   Popup menus
#####################################################################
[gcode_macro FILAMENT_LOAD_MENU]
description: Popup: pick the filament to load
gcode:
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("FILAMENT_LOAD_MENU: not while printing. Pause first.") }
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin Load filament"
    RESPOND TYPE=command MSG="action:prompt_text Which filament?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PLA|_FILAMENT_LOAD_PLA|primary"
    RESPOND TYPE=command MSG="action:prompt_button ABS|_FILAMENT_LOAD_ABS|warning"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Current temp|FILAMENT_LOAD|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro FILAMENT_UNLOAD_MENU]
description: Popup: pick the filament being unloaded
gcode:
    {% if printer.print_stats.state == "printing" %}
        { action_raise_error("FILAMENT_UNLOAD_MENU: not while printing. Pause first.") }
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin Unload filament"
    RESPOND TYPE=command MSG="action:prompt_text Which filament is loaded?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PLA|_FILAMENT_UNLOAD_PLA|primary"
    RESPOND TYPE=command MSG="action:prompt_button ABS|_FILAMENT_UNLOAD_ABS|warning"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Current temp|FILAMENT_UNLOAD|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"

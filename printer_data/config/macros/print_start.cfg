#####################################################################
##   Print Start (cancellable bed / chamber / nozzle heat-up)
##
##   Replaces the old PRINT_START macro. Slicer start G-code is unchanged:
##     PRINT_START BED=.. EXTRUDER=.. CHAMBER=..
##
##   How it works
##   1. PRINT_START starts the bed heater, homes, then pauses the file
##      (BASE_PAUSE) and ends. Nothing is blocking, so Cancel works at once.
##   2. _PRINT_START_WAIT checks every few seconds if the bed (and chamber,
##      if requested) are ready.
##   3. When ready it heats the nozzle to 180 (a short blocking wait), then
##      ends and re-arms itself. That gap is cancel checkpoint 1.
##   4. Next run it does the leveling / mesh / final nozzle heat, then ends
##      and re-arms itself again. That gap is cancel checkpoint 2.
##   5. Last run it cleans the nozzle, purges, then resumes the file.
##
##   Add to CANCEL_PRINT (see the bottom of this file):
##     UPDATE_DELAYED_GCODE ID=_PRINT_START_WAIT DURATION=0
##     SET_IDLE_TIMEOUT TIMEOUT=<your normal idle timeout>
#####################################################################


#####################################################################
##   Shared values and progress
#####################################################################
[gcode_macro _PRINT_START_STATE]
description: Values and progress shared by the PRINT_START macros
variable_bed: 0
variable_hotend: 0
variable_chamber: 0
variable_stage: 0           # 0 = waiting for bed, 1 = waiting for chamber, 2 = checkpoint 1, 3 = checkpoint 2
variable_poll: 5            # seconds between temperature checks
variable_z_offset: 0.06     # hotend thermal expansion offset, applied just before the print
gcode:


#####################################################################
##   Part 1: start heating, home, pause the file
#####################################################################
[gcode_macro PRINT_START]
gcode:
    {% set bedtemp = params.BED|int %}                                  # get bed temp from slicer
    {% set hotendtemp = params.EXTRUDER|int %}                          # get nozzle temp from slicer
    {% set chambertemp = params.CHAMBER|default(0)|int %}               # get chamber temp from slicer
    {% set z_speed = printer["gcode_macro _SETTINGS"].z_speed %}        # get z_speed from macro_settings
    # SKEW_PROFILE LOAD=my_skew_profile
    # SET_PIN PIN=caselight VALUE=1.0  ; turn on case light
    M221 S100             # reset flow to 100%
    M220 S100             # reset speed to 100%
    {% set pc = printer.configfile.settings.printer %}
    SET_VELOCITY_LIMIT VELOCITY={pc.max_velocity} ACCEL={pc.max_accel} SQUARE_CORNER_VELOCITY={pc.square_corner_velocity}

    PREFLIGHT_CHECK       # check for HEF

    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0

    ## heat up bed
    SET_LED LED=nozzle_led GREEN=0.5 RED=1 BLUE=0 WHITE=0      # LED: orange
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bedtemp}  # set bed temp

    G28                # home axes
    G0 Z2 F{z_speed}   # position beacon at 2mm for heat soak

    ## hand the values to the timer
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=bed VALUE={bedtemp}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=hotend VALUE={hotendtemp}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=chamber VALUE={chambertemp}
    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=stage VALUE=0

    ## pause the file while the bed / chamber heat, so Cancel works immediately
    RESPOND TYPE=error MSG="Heating bed to {bedtemp}c"
    SET_IDLE_TIMEOUT TIMEOUT=43200      # don't let the idle timeout turn heaters off during a long soak
    BASE_PAUSE
    UPDATE_DELAYED_GCODE ID=_PRINT_START_WAIT DURATION=5


#####################################################################
##   Timer: polls bed / chamber, heats nozzle, runs the rest
#####################################################################
[delayed_gcode _PRINT_START_WAIT]
gcode:
    {% set s = printer["gcode_macro _PRINT_START_STATE"] %}
    {% if printer.pause_resume.is_paused %}
        {% set stage = s.stage|int %}

        {% if stage == 3 %}
            ## checkpoint 2 passed: clean, purge, then resume the file
            SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=stage VALUE=0
            _PRINT_START_FINISH
            SAVE_GCODE_STATE STATE=PAUSE_STATE   # so BASE_RESUME restores the current state, not the old one
            SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
            BASE_RESUME
            SET_GCODE_OFFSET Z={s.z_offset}      # safety net in case the offset was reset
        {% elif stage == 2 %}
            ## checkpoint 1 passed: level, mesh, final nozzle heat, then pass checkpoint 2
            _PRINT_START_CONTINUE
            SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=stage VALUE=3
            UPDATE_DELAYED_GCODE ID=_PRINT_START_WAIT DURATION=1
        {% else %}
            {% set bed_t = printer.heater_bed.temperature|float %}
            {% set bed_ok = (stage == 1) or (bed_t >= s.bed|float - 1 and bed_t <= s.bed|float + 5) %}
            {% set ch_t = printer["temperature_sensor chamber_temp"].temperature|float if s.chamber|int > 0 else 0 %}

            {% if not bed_ok %}
                UPDATE_DELAYED_GCODE ID=_PRINT_START_WAIT DURATION={s.poll}
            {% elif s.chamber|int > 0 and ch_t < s.chamber|float %}
                ## wait for chamber to reach temp if ABS
                {% if stage == 0 %}
                    SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=stage VALUE=1
                    RESPOND TYPE=error MSG="Waiting for chamber to reach {s.chamber|int}c"
                {% endif %}
                SET_FAN_SPEED FAN=bed_fans SPEED=0.8
                UPDATE_DELAYED_GCODE ID=_PRINT_START_WAIT DURATION={s.poll}
            {% else %}
                ## bed (and chamber) ready: heat the nozzle, then pass cancel checkpoint 1
                {% if s.chamber|int > 0 %}
                    SET_FAN_SPEED FAN=bed_fans SPEED=0.8
                {% endif %}
                _PRINT_START_HEAT_NOZZLE
                SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=stage VALUE=2
                UPDATE_DELAYED_GCODE ID=_PRINT_START_WAIT DURATION=1
            {% endif %}
        {% endif %}
    {% endif %}


#####################################################################
##   Part 2a: nozzle to 180 (short blocking wait)
#####################################################################
[gcode_macro _PRINT_START_HEAT_NOZZLE]
gcode:
    ## heat hotend to 180c
    RESPOND TYPE=error MSG="Heating hotend to 175c"
    SET_LED LED="nozzle_led" RED=1.0 GREEN=0 BLUE=0 WHITE=0   # LED: red
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=180
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM=175 MAXIMUM=180  # heat hotend to 180


#####################################################################
##   Part 2b: leveling, mesh, final nozzle heat
#####################################################################
[gcode_macro _PRINT_START_CONTINUE]
gcode:
    {% set s = printer["gcode_macro _PRINT_START_STATE"] %}
    {% set hotendtemp = s.hotend|int %}

    ## rehome Z/level bed/bed mesh
    RESPOND TYPE=error MSG="leveling bed"
    SET_LED LED="nozzle_led" RED=0 GREEN=0 BLUE=0 WHITE=1   # LED: white

    G28 Z METHOD=PROXIMITY  # calibrate z offset and beacon model hot
    Z_TILT_ADJUST           # z tilt
    CLEAN_NOZZLE            # clean nozzle macro
    G28 Z METHOD=PROXIMITY  # calibrate z offset and beacon model hot
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=182   # Beacon contact limit is 185, wait until clearly under it
    BEACON_AUTO_CALIBRATE

    BED_MESH_CALIBRATE SPEED=250 RUNS=4    # bed mesh in scan mode

    NOZZLE_PARK

    ## heat hotend
    RESPOND TYPE=error MSG="Heating hotend to {hotendtemp}c"
    SET_LED LED="nozzle_led" RED=1 GREEN=0 BLUE=0 WHITE=0  # LED: red
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={hotendtemp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hotendtemp-1} MAXIMUM={hotendtemp+1}  # heat nozzle to slicer temp


#####################################################################
##   Part 2c: clean, offset, purge
#####################################################################
[gcode_macro _PRINT_START_FINISH]
gcode:
    {% set s = printer["gcode_macro _PRINT_START_STATE"] %}

    CLEAN_NOZZLE            # clean nozzle right before print in case there's ooze

    ## LET'S FUCKING GO!!!!!
    RESPOND TYPE=error MSG="LET'S FUCKING GOOO !!"
    SET_LED LED=nozzle_led GREEN=0 RED=0 BLUE=0 WHITE=1 # LED: white

    SET_GCODE_OFFSET Z={s.z_offset}  # add a little offset for hotend thermal expansion, needs fine tuning, long meltzones require more

    G91                     # relative
    G1 Y-5 F15000           # move left 5mm (Y-5) from the wipe position, off the brush line
    G90                     # absolute

    START_PURGE


#####################################################################
##   Add these two lines to your CANCEL_PRINT macro (before BASE_CANCEL_PRINT):
##
##     UPDATE_DELAYED_GCODE ID=_PRINT_START_WAIT DURATION=0
##     SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
#####################################################################
#####################################################################
##   Cancel Print
#####################################################################

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    BASE_CANCEL_PRINT                   # cancel the job state first

    UPDATE_DELAYED_GCODE ID=_PRINT_START_WAIT DURATION=0   # stop the start-up timer
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

    PRINT_END
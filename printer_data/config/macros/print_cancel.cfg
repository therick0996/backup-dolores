#####################################################################
##   Cancel Print
#####################################################################

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:

    # 1. Immediately tell Klipper to cancel the job state first
    BASE_CANCEL_PRINT

    # 
    UPDATE_DELAYED_GCODE ID=_PRINT_START_WAIT DURATION=0
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 20, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_CANCEL_PRINT
    # SET_SKEW CLEAR=1
    
    M400                    # wait for buffer to clear
    G92 E0                  # zero the extruder
    G1 E-2 F1800            # retract filament

    G90                     # absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F12000  # move nozzle to remove stringing
    
    NOZZLE_PARK
    
    M107                    # turn off part cooling fan
    BED_MESH_CLEAR          # clear bed mesh
    TURN_OFF_HEATERS        # turn off heaters

    SET_FAN_SPEED FAN=nevermore SPEED=0     # turn off nevermore fan
    SET_FAN_SPEED FAN=bed_fans SPEED=0      # turn off bed fans
    
    # G91                     # relative positioning
    # G0 Z10 F3600            # move bed down 10mm

    M221 S100               # reset flow to 100%
    M220 S100               # reset speed to 100%

    SET_LED LED="nozzle_led" RED=0 GREEN=0 BLUE=0 WHITE=0  # LED off

    RESTORE_GCODE_STATE NAME=STATE_CANCEL_PRINT

    M84                     # disable motors
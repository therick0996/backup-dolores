#####################################################################
##   Resume Print
#####################################################################

[gcode_macro RESUME]
rename_existing: BASE_RESUME

variable_etemp: 0
variable_xy_speed: 200
variable_xy_accel: 7500
variable_z_slow: 5
variable_resume_x: 0
variable_resume_y: 0
variable_resume_z: 0
variable_hop_z: 0
variable_saved_velocity: 0
variable_saved_accel: 0

gcode:
    {% if printer.pause_resume.is_paused %}

        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

        {% if etemp > 0 %}
            M109 S{etemp|int}
        {% endif %}

        {% set z_speed = printer["gcode_macro _SETTINGS"].z_speed %}        # get z_speed from macro_settings
        SET_VELOCITY_LIMIT VELOCITY={xy_speed} ACCEL={xy_accel}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED={xy_speed}

        CLEAN_NOZZLE
        G10             # retract immediately after the wipe
        G4 P250         # settle, now with the filament retracted

        G90

        # 1. Make sure we're at the raised height before any XY travel,
        #    regardless of what CLEAN_NOZZLE did to Z
        G1 Z{hop_z} F{z_speed} * 60}

        # 2. Travel over the print position
        G1 X{resume_x} Y{resume_y} F{xy_speed * 60}

        # 3. Only now lower Z
        G1 Z{resume_z + 1} F{z_speed} * 60}
        G1 Z{resume_z} F{z_slow * 60}

        RESTORE_GCODE_STATE NAME=PAUSE MOVE=0
        SET_VELOCITY_LIMIT VELOCITY={saved_velocity} ACCEL={saved_accel}

        BASE_RESUME

    {% endif %}